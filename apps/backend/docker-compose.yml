services:
  wildlife-safety-network:
    build: .
    environment:
      HOST: 0.0.0.0
      NODE_ENV: development
      PORT: 3001

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-wsn_dev}
      DB_USER: ${DB_USER:-wsn_local}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in apps/backend/.env}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${PORT:-3001}:3001"

    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-wsn_local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in apps/backend/.env}
      POSTGRES_DB: ${DB_NAME:-wsn_dev}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  backend_node_modules:
  postgres_data:
